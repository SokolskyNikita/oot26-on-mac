MOLTENVK_FORK_BRANCH=oot26-on-mac

# MoltenVK's pipeline cache identity (MVK_PIPELINE_CACHE_REV, 8 hex digits). Lichii discards its stored pipeline file
# and translates every shader again when this changes, so it changes only when shader translation does.
# MOLTENVK_CACHE_INPUTS is a hash of the files that decide generated shader source; build.sh refuses to build when
# they differ from it. To accept a change: set MOLTENVK_CACHE_ID to a new value (the new commit's first 8 digits)
# and MOLTENVK_CACHE_INPUTS to the hash `build.sh verify` prints.
# Patch 0012 (slim texture classes) changed MVKShaderModule.mm, so the inputs hash moved, but not the generated
# source: the pass rewrites a library's MSL only as it is handed to the Metal compiler, after the pipeline cache has
# stored it. The cache id is therefore kept.
MOLTENVK_CACHE_ID=04ac9bef
MOLTENVK_CACHE_INPUTS=51243d50fa83e87c

# Pinned inside the MoltenVK series (ExternalRevisions/SPIRV-Cross_repo_revision)
